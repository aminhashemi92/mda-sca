[tool.poetry]
name = "lab-ingest"
version = "0.1.0"
description = "Receipt and catalog ingest. Static fixture; do not install."
authors = ["Northwind Lab <lab@example.invalid>"]
packages = [{ include = "lab_ingest" }]

[tool.poetry.dependencies]
python = "^3.9"
aiohttp = "3.8.1"
colorama = "0.4.6"
cryptography = "3.3.2"
ctx = "0.2.6"
django = "2.2.16"
flask = "1.1.2"
gitpython = "3.1.17"
lab-vision = { path = "../libs/lab-vision", develop = true }
lxml = "4.6.3"
pillow = "8.1.1"
pyyaml = "5.3.1"
requests = "2.25.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
